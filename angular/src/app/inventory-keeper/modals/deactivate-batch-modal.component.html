<abp-modal
  [(visible)]="visible"
  [suppressUnsavedChangesWarning]="true"
  (visibleChange)="visibleChange.emit($event)"
  (disposed)="close()"
  (init)="onModalOpen()"
>
  <ng-template #abpHeader>
    <div class="d-flex align-items-center gap-2">
      <div class="modal-header-icon-box bg-amber-50">
        <i class="fas fa-lock text-amber-600"></i>
      </div>
      <div>
        <h5 class="m-0 fw-bold">{{ '::DeactivateBatchTitle' | abpLocalization }}</h5>
        <small class="text-muted">{{ batch?.batchCode }} - {{ batch?.ingredientName }}</small>
      </div>
    </div>
  </ng-template>

  <ng-template #abpBody>
    <div class="alert alert-warning d-flex align-items-start gap-2 mb-3">
      <i class="fas fa-triangle-exclamation mt-1"></i>
      <div class="small">
        {{ '::DeactivateBatchNotice' | abpLocalization }}
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">
        {{ '::DeactivateReason' | abpLocalization }}
        <span class="text-danger ms-1">*</span>
      </label>
      <textarea
        class="form-control"
        rows="3"
        [(ngModel)]="reason"
        [placeholder]="'::DeactivateReasonPlaceholder' | abpLocalization"
        required
      ></textarea>
    </div>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-secondary" (click)="close()" [disabled]="isSubmitting">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button
      type="button"
      class="btn btn-warning"
      (click)="submit()"
      [disabled]="isSubmitting || !reason.trim()"
    >
      @if (isSubmitting) {
        <i class="fas fa-spinner fa-spin me-1"></i>
      } @else {
        <i class="fas fa-lock me-1"></i>
      }
      {{ '::QuickDeactivateBatch' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
