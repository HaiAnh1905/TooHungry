<abp-modal
  [(visible)]="visible"
  [suppressUnsavedChangesWarning]="true"
  (visibleChange)="visibleChange.emit($event)"
  (disposed)="close()"
  (init)="onModalOpen()"
>
  <ng-template #abpHeader>
    <div class="d-flex align-items-center gap-2">
      <div class="modal-header-icon-box">
        <i class="fas fa-barcode text-primary-orange"></i>
      </div>
      <div>
        <h5 class="m-0 fw-bold">{{ '::BarcodeScannerTitle' | abpLocalization }}</h5>
        <small class="text-muted">{{ '::BarcodeScannerHint' | abpLocalization }}</small>
      </div>
    </div>
  </ng-template>

  <ng-template #abpBody>
    <div class="camera-scanner-container">
      @if (hasCameraError) {
        <div class="camera-error-alert alert alert-warning d-flex align-items-center gap-2 mb-3">
          <i class="fas fa-exclamation-triangle"></i>
          <div>
            <strong>{{ '::Warning' | abpLocalization }}:</strong> {{ cameraErrorMessage }}
          </div>
        </div>
      }

      <!-- VÙNG HIỂN THỊ CAMERA & KHUNG NGẮM LASER -->
      <div class="camera-viewfinder-wrapper">
        <video #videoElement class="camera-video-stream" autoplay playsinline muted></video>

        <!-- Khung ngắm Laser Cam #EA580C -->
        <div class="laser-scanner-reticle">
          <div class="corner-bracket top-left"></div>
          <div class="corner-bracket top-right"></div>
          <div class="corner-bracket bottom-left"></div>
          <div class="corner-bracket bottom-right"></div>
          <div class="laser-beam"></div>
        </div>
      </div>

      <!-- Ô NHẬP TAY MÃ DỰ PHÒNG -->
      <div class="manual-input-card mt-3">
        <label class="form-label fw-bold small text-muted">
          <i class="fas fa-keyboard me-1"></i>
          {{ '::ManualBarcodeInput' | abpLocalization }}
        </label>
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="manualCode"
            [placeholder]="'::KeeperSearchPlaceholder' | abpLocalization"
            (keyup.enter)="submitManualCode()"
          />
          <button
            type="button"
            class="btn btn-primary-orange"
            [disabled]="!manualCode.trim()"
            (click)="submitManualCode()"
          >
            <i class="fas fa-check me-1"></i>
            {{ '::Apply' | abpLocalization }}
          </button>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-secondary" (click)="close()">
      {{ '::Close' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
