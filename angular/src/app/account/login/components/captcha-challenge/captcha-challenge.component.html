<div class="captcha-challenge-box" [class.is-disabled]="disabled">
  <div class="captcha-header">
    <div class="shield-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
    <span class="captcha-title">{{ '::CaptchaChallengeTitle' | abpLocalization }}</span>
    <button type="button" class="btn-refresh" (click)="onRefresh()" [disabled]="disabled" title="{{ '::RefreshCaptcha' | abpLocalization }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
    </button>
  </div>

  <div class="captcha-body">
    <div class="math-question">{{ question || '... + ... = ?' }}</div>
    <input
      type="text"
      inputmode="numeric"
      class="captcha-input"
      placeholder="{{ '::EnterCaptchaAnswer' | abpLocalization }}"
      [(ngModel)]="answer"
      (ngModelChange)="onAnswerInput()"
      [disabled]="disabled"
      maxlength="6"
    />
  </div>
</div>
