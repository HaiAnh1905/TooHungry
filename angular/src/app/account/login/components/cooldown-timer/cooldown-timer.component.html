<div class="cooldown-bento-card" [class.admin-locked]="isAdminLocked" role="alert" aria-live="polite">
  <div class="cooldown-header">
    <div class="lock-icon-container" [class.admin-icon]="isAdminLocked">
      <svg *ngIf="!isAdminLocked" class="lock-icon-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <svg *ngIf="isAdminLocked" class="lock-icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <rect width="8" height="5" x="8" y="11" rx="1" ry="1"/>
        <path d="M9.5 11V9.5a2.5 2.5 0 0 1 5 0V11"/>
      </svg>
    </div>
    <div class="cooldown-text">
      <h4 class="cooldown-title">
        {{ (isAdminLocked ? '::AdminLockedAccountTitle' : '::CooldownTimerTitle') | abpLocalization }}
      </h4>
      <p class="cooldown-subtitle">
        {{ customMessage || ((isAdminLocked ? '::AdminLockedAccountMessage' : '::CooldownTimerSubtitle') | abpLocalization) }}
      </p>
    </div>
  </div>

  <!-- Countdown display: CHỈ HIỂN THỊ KHI KHÓA TẠM THỜI BRUTE-FORCE, KHÔNG HIỆN KHI ADMIN KHÓA -->
  <div *ngIf="!isAdminLocked" class="cooldown-timer-display">
    <span class="timer-badge">{{ '::LockoutLevel' | abpLocalization }}: {{ lockoutLevel }}</span>
    <span class="timer-digits">{{ formattedTime }}</span>
  </div>

  <!-- Nút quay lại trang đăng nhập (để đăng nhập tài khoản khác) -->
  <div class="cooldown-actions">
    <button type="button" class="btn-back-to-login" (click)="onBackToLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span>{{ '::BackToLogin' | abpLocalization }}</span>
    </button>
  </div>
</div>
